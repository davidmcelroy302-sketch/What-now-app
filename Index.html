<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>WHAT NOW?</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#111;color:#fff;min-height:100vh}
.app{max-width:520px;margin:auto;min-height:100vh;padding:28px 20px 36px;display:flex;flex-direction:column}
.logo{font-weight:900;font-size:38px;letter-spacing:-2px;margin-top:18px}.tag{color:#aaa;margin:0 0 30px;font-size:16px}
.screen{display:none}.screen.active{display:block}.question{font-size:28px;font-weight:800;margin:20px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice,.primary,.secondary{border:0;border-radius:18px;padding:20px 14px;font-size:17px;font-weight:750;cursor:pointer}
.choice{background:#222;color:#fff;text-align:left}.choice.selected{outline:3px solid #fff;background:#333}.emoji{font-size:27px;display:block;margin-bottom:8px}
.primary{width:100%;background:#fff;color:#111;margin-top:20px}.secondary{width:100%;background:#222;color:#fff;margin-top:12px}
.back{background:none;border:0;color:#aaa;font-size:15px;padding:10px 0;cursor:pointer}
.hero{min-height:70vh;display:flex;flex-direction:column;justify-content:center;text-align:center}.hero h1{font-size:48px;letter-spacing:-3px;margin:0 0 8px}.hero p{color:#aaa;font-size:18px}.hero .primary{font-size:21px;padding:22px}
.mission{background:#fff;color:#111;border-radius:26px;padding:28px 22px;margin-top:25px}.mission .label{font-size:13px;font-weight:900;letter-spacing:1.5px}.mission h2{font-size:29px;line-height:1.08;margin:10px 0 16px}.mission p{font-size:18px;line-height:1.5}.meta{color:#666;font-size:14px;margin-top:18px}
.progress{height:5px;background:#292929;border-radius:9px;margin:10px 0 25px}.bar{height:100%;background:#fff;border-radius:9px;width:25%}
.small{color:#777;text-align:center;font-size:12px;margin-top:auto;padding-top:25px}
</style>
</head>
<body>
<div class="app">
  <div class="logo">WHAT NOW?</div>
  <p class="tag">Stop scrolling. Start doing.</p>

  <section id="s0" class="screen active">
    <div class="hero">
      <h1>I'm bored.</h1>
      <p>Let's fix that.</p>
      <button class="primary" onclick="start()">🔥 I'M BORED</button>
      <button class="secondary" onclick="start()">👯 Challenge my friends</button>
    </div>
  </section>

  <section id="s1" class="screen">
    <div class="progress"><div class="bar"></div></div>
    <div class="question">Who are you with?</div>
    <div class="grid">
      <button class="choice" onclick="pick('who','alone',this)"><span class="emoji">🙋</span>Alone</button>
      <button class="choice" onclick="pick('who','friends',this)"><span class="emoji">👯</span>Friends</button>
      <button class="choice" onclick="pick('who','date',this)"><span class="emoji">❤️</span>Date</button>
      <button class="choice" onclick="pick('who','family',this)"><span class="emoji">👨‍👩‍👧</span>Family</button>
    </div>
    <button class="primary" onclick="next(2)">NEXT →</button>
  </section>

  <section id="s2" class="screen">
    <div class="progress"><div class="bar" style="width:50%"></div></div>
    <div class="question">What's your budget?</div>
    <div class="grid">
      <button class="choice" onclick="pick('budget','0',this)"><span class="emoji">🤑</span>$0</button>
      <button class="choice" onclick="pick('budget','10',this)"><span class="emoji">💵</span>Under $10</button>
      <button class="choice" onclick="pick('budget','25',this)"><span class="emoji">💰</span>Under $25</button>
      <button class="choice" onclick="pick('budget','50',this)"><span class="emoji">💳</span>$50+</button>
    </div>
    <button class="primary" onclick="next(3)">NEXT →</button>
    <button class="back" onclick="next(1)">← Back</button>
  </section>

  <section id="s3" class="screen">
    <div class="progress"><div class="bar" style="width:75%"></div></div>
    <div class="question">How much time?</div>
    <div class="grid">
      <button class="choice" onclick="pick('time','15',this)"><span class="emoji">⚡</span>15 minutes</button>
      <button class="choice" onclick="pick('time','30',this)"><span class="emoji">⏰</span>30 minutes</button>
      <button class="choice" onclick="pick('time','60',this)"><span class="emoji">🕐</span>1 hour</button>
      <button class="choice" onclick="pick('time','all',this)"><span class="emoji">🌎</span>All day</button>
    </div>
    <button class="primary" onclick="next(4)">NEXT →</button>
    <button class="back" onclick="next(2)">← Back</button>
  </section>

  <section id="s4" class="screen">
    <div class="progress"><div class="bar" style="width:100%"></div></div>
    <div class="question">What's your vibe?</div>
    <div class="grid">
      <button class="choice" onclick="pick('mood','funny',this)"><span class="emoji">😂</span>Funny</button>
      <button class="choice" onclick="pick('mood','competitive',this)"><span class="emoji">🎯</span>Competitive</button>
      <button class="choice" onclick="pick('mood','random',this)"><span class="emoji">🤪</span>Random</button>
      <button class="choice" onclick="pick('mood','adventure',this)"><span class="emoji">🧗</span>Adventure</button>
      <button class="choice" onclick="pick('mood','chill',this)"><span class="emoji">😌</span>Chill</button>
    </div>
    <button class="primary" onclick="generate()">🎯 GIVE ME A MISSION</button>
    <button class="back" onclick="next(3)">← Back</button>
  </section>

  <section id="s5" class="screen">
    <div class="question">Your mission</div>
    <div class="mission">
      <div class="label">🎯 WHAT NOW?</div>
      <h2 id="mtitle"></h2>
      <p id="mbody"></p>
      <div class="meta" id="mmeta"></div>
    </div>
    <button class="primary" onclick="complete()">✓ WE DID IT</button>
    <button class="secondary" onclick="generate()">🔄 Give me another</button>
    <button class="back" onclick="next(0)">← Start over</button>
  </section>

  <div class="small">Prototype v0.1 • Built to test the idea</div>
</div>
<script>
const state={who:null,budget:null,time:null,mood:null};
const missions=[
 {m:'funny',b:0,t:60,title:'THE $0 PHOTO HUNT',body:'Find something shaped like a face, the weirdest sign you can find, something nobody else notices, and the funniest object nearby. Take a photo of each. Everyone votes for the winner.',meta:'$0 • Up to 1 hour'},
 {m:'competitive',b:10,t:60,title:'THE $5 BATTLE',body:'Each person gets $5. Go somewhere with lots of small items. You have 15 minutes to find the funniest thing you can buy. Meet back up and vote. Winner takes the bragging rights.',meta:'Up to $10 • Up to 1 hour'},
 {m:'random',b:25,t:30,title:'RANDOM DESTINATION',body:'Pick a direction without thinking. Walk or drive for 10 minutes. Stop at the first interesting place you see. Everyone has to find one thing they have never noticed before.',meta:'Under $25 • 30 minutes'},
 {m:'adventure',b:25,t:60,title:'THE MINI ADVENTURE',body:'Go somewhere nearby you have never explored. Each person chooses one tiny mission: find a viewpoint, a weird landmark, a new snack, or a hidden photo spot. Compare results.',meta:'Under $25 • 1 hour'},
 {m:'chill',b:0,t:60,title:'NO-SCROLL HOUR',body:'Put every phone on Do Not Disturb for one hour. Make drinks or snacks, choose three songs each, and take turns telling the group a story nobody has heard before.',meta:'$0 • 1 hour'},
 {m:'funny',b:10,t:30,title:'THE TERRIBLE COMMERCIAL',body:'Choose the most ordinary object nearby. You have 10 minutes to make a ridiculous 30-second commercial for it. Record it. Everyone votes on the best pitch.',meta:'Under $10 • 30 minutes'},
 {m:'competitive',b:0,t:30,title:'THE 30-MINUTE OLYMPICS',body:'Invent three safe mini-games using whatever is around you. Everyone gets points. No buying anything. Winner chooses the next group activity.',meta:'$0 • 30 minutes'},
 {m:'random',b:0,t:15,title:'15-MINUTE WEIRD WALK',body:'Walk for 7 minutes in a direction you normally would not take. On the way back, each person has to photograph the strangest thing they saw.',meta:'$0 • 15 minutes'}
];
function start(){next(1)}
function pick(k,v,el){state[k]=v;[...el.parentElement.children].forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function next(n){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('s'+n).classList.add('active');window.scrollTo(0,0)}
function generate(){
 let list=missions.filter(x=>!state.mood||x.m===state.mood);
 if(!list.length) list=missions;
 const x=list[Math.floor(Math.random()*list.length)];
 document.getElementById('mtitle').textContent=x.title;
 document.getElementById('mbody').textContent=x.body;
 document.getElementById('mmeta').textContent=x.meta;
 next(5);
}
function complete(){alert('🔥 Mission complete! Challenge your friends and do another one.');next(0)}
</script>
</body>
</html>
